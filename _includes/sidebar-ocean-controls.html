<div class="sidebar-ocean-controls w-100">
  <div class="ocean-time-bar">
    <span aria-hidden="true">DAWN</span>
    <input
      id="sidebar-ocean-time"
      type="range"
      min="0"
      max="1000"
      step="1"
      value="600"
      aria-label="바다 배경 시간대"
    >
    <span aria-hidden="true">NIGHT</span>
  </div>
</div>
